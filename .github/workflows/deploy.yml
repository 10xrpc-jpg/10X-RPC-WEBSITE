# 10X RPC — automatic production deploy to Vercel.
#
# Runs on every push to main ONCE the repo secrets are configured. Until then
# it marks the commit in red (context "deploy/vercel") and writes a setup guide
# to the Actions run summary — production staying stale is impossible to miss.
#
# ONE-TIME SETUP (repo Settings → Secrets and variables → Actions → New repo secret):
#   VERCEL_TOKEN      — vercel.com → top-right avatar → Settings → Tokens → Create
#   VERCEL_ORG_ID     — vercel.com → <project> → Settings → General → "Vercel ID"
#   VERCEL_PROJECT_ID — same page, right below: "Project ID"
#
# After adding the three secrets: Actions → "Deploy to Vercel" → Run workflow
# (adding secrets alone does not re-trigger a push run). Every later push to
# main then deploys automatically.
#
# Alternative (zero IDs needed): Vercel dashboard → project → Settings → Git →
# connect this repo/branch — Vercel then deploys on push natively and this
# workflow stays dormant.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_VERCEL_SECRETS: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark commit red — production NOT updated (secrets missing)
        if: env.HAS_VERCEL_SECRETS != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d '{
              "state": "failure",
              "context": "deploy/vercel",
              "description": "Production NOT updated — add VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID repo secrets, then re-run this workflow",
              "target_url": "https://github.com/'"$REPO"'/actions/workflows/deploy.yml"
            }' > /dev/null

      - name: Setup guide (secrets not configured)
        if: env.HAS_VERCEL_SECRETS != 'true'
        run: |
          {
            echo "## ⚠️ Production was NOT deployed — Vercel secrets are missing"
            echo ""
            echo "The site at \`10x-rpc.vercel.app\` still runs an **old build** (profile page, RPC fixes etc. are all on \`main\` but not live)."
            echo ""
            echo "### Fastest fix — add 3 repo secrets (≈60 seconds)"
            echo "1. Go to **vercel.com → your account → Settings → Tokens → Create Token** (scope: full account) and copy it."
            echo "2. Go to **vercel.com → your project → Settings → General** and copy **Vercel ID** (org) and **Project ID**."
            echo "3. In GitHub: this repo → **Settings → Secrets and variables → Actions → New repository secret** and add:"
            echo "   - \`VERCEL_TOKEN\`"
            echo "   - \`VERCEL_ORG_ID\`"
            echo "   - \`VERCEL_PROJECT_ID\`"
            echo "4. Come back here: **Actions → Deploy to Vercel → Run workflow** (branch: main)."
            echo ""
            echo "### Alternative — connect the Vercel GitHub App (no IDs needed)"
            echo "Vercel dashboard → project → **Settings → Git → Connect** this repo + \`main\` branch. Vercel then deploys every push natively and this workflow stays dormant."
            echo ""
            echo "> After the first successful deploy, the red ✕ on this commit (context \`deploy/vercel\`) disappears and every push to \`main\` auto-deploys."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "VERCEL_TOKEN secret is not set — production not deployed. See the run summary for the 60-second setup."

      - uses: actions/setup-node@v4
        if: env.HAS_VERCEL_SECRETS == 'true'
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npm i -g vercel@latest

      - name: Link Vercel project
        if: env.HAS_VERCEL_SECRETS == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Pull production environment
        if: env.HAS_VERCEL_SECRETS == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Report production env presence (names only — values never read)
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          CRITICAL="DATABASE_URL SESSION_SECRET DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN DISCORD_REDIRECT_URI NEXT_PUBLIC_APP_URL"
          echo "## Production env check" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "Variable **names** only — values are never read or printed." >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          MISSING=""
          for v in $CRITICAL; do
            if grep -qE "^${v}=" .env.local 2>/dev/null; then
              echo "- \`$v\` ✅ present" >> "$SUMMARY"
            else
              echo "- \`$v\` ❌ **missing**" >> "$SUMMARY"
              MISSING="$MISSING \`$v\`"
            fi
          done
          echo "" >> "$SUMMARY"
          if [ -n "$MISSING" ]; then
            echo "### ⚠️ Missing critical env vars:$MISSING" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "DB-backed features (login, plans, payments) **will fail** until these exist." >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "**Fix (no dashboard needed):** add each missing value as a GitHub repo secret with the **same name** (Settings → Secrets and variables → Actions), then run **Actions → Fix production env (set missing vars + redeploy)** — it pushes the values into Vercel Production and triggers this deploy again." >> "$SUMMARY"
          else
            echo "All critical env vars present ✅" >> "$SUMMARY"
          fi
          echo "" >> "$SUMMARY"

      - name: Build (production, with project env)
        if: env.HAS_VERCEL_SECRETS == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        if: env.HAS_VERCEL_SECRETS == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Attach custom domains (10xrpc.shop + www) + print DNS records
        if: always() && env.HAS_VERCEL_SECRETS == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          APEX: 10xrpc.shop
        run: |
          set -u
          SUMMARY="$GITHUB_STEP_SUMMARY"

          # api <method> <path> [json-body] — tries with teamId first, then personal-account fallback
          api() {
            local method="$1" path="$2" body="${3:-}" url try code bodyout resp
            for try in 1 2; do
              if [ "$try" = 1 ] && [ -n "$VERCEL_ORG_ID" ]; then
                url="https://api.vercel.com${path}?teamId=$VERCEL_ORG_ID"
              else
                url="https://api.vercel.com${path}"
              fi
              if [ -n "$body" ]; then
                RESP=$(curl -sS -X "$method" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "$body" -w $'\n%{http_code}' "$url" 2>&1)
              else
                RESP=$(curl -sS -X "$method" -H "Authorization: Bearer $VERCEL_TOKEN" -w $'\n%{http_code}' "$url" 2>&1)
              fi
              CODE=$(printf '%s' "$RESP" | tail -n1)
              BODYOUT=$(printf '%s' "$RESP" | sed '$d')
              if [ "$CODE" = 403 ] || [ "$CODE" = 404 ]; then continue; fi
              printf '%s\n%s' "$CODE" "$BODYOUT"
              return 0
            done
            printf '%s\n%s' "$CODE" "$BODYOUT"
          }

          attach() {
            local name="$1" redirect="$2" body out code
            if [ -n "$redirect" ]; then
              body="{\"name\":\"$name\",\"redirect\":\"$redirect\"}"
            else
              body="{\"name\":\"$name\"}"
            fi
            out=$(api POST "/v9/projects/$VERCEL_PROJECT_ID/domains" "$body")
            code=$(printf '%s' "$out" | head -n1)
            echo "attach $name → HTTP $code $(printf '%s' "$out" | tail -n +2 | head -c 300)"
          }

          echo "## Custom domain: $APEX" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          attach "$APEX" ""
          attach "www.$APEX" "$APEX"

          echo "" >> "$SUMMARY"
          echo "### DNS records to add at your registrar (BigRock)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| Type | Name | Value |" >> "$SUMMARY"
          echo "|---|---|---|" >> "$SUMMARY"
          echo "| A | \`@\` (10xrpc.shop) | \`216.198.79.195\` (or legacy \`76.76.21.21\`) |" >> "$SUMMARY"
          echo "| CNAME | \`www\` | \`cname.vercel-dns.com\` |" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          for d in "$APEX" "www.$APEX"; do
            out=$(api GET "/v4/domains/$d")
            code=$(printf '%s' "$out" | head -n1)
            json=$(printf '%s' "$out" | tail -n +2)
            if [ "$code" = 200 ]; then
              verified=$(printf '%s' "$json" | grep -o '"verified":[a-z]*' | head -n1 | cut -d: -f2)
              misconf=$(printf '%s' "$json" | grep -o '"misconfigured":[a-z]*' | head -n1 | cut -d: -f2)
              echo "- \`$d\` → verified: **${verified:-?}**, misconfigured: **${misconf:-?}**" >> "$SUMMARY"
            else
              echo "- \`$d\` → lookup HTTP $code: $(printf '%s' "$json" | head -c 200)" >> "$SUMMARY"
            fi
          done
          echo "" >> "$SUMMARY"
          echo "After adding the records above, wait for DNS (minutes–48h) and run **Actions → Check DNS for 10xrpc.shop** to verify." >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "> Also update Vercel env \`NEXT_PUBLIC_APP_URL=https://$APEX\` and the Discord OAuth redirect URI once the domain verifies." >> "$SUMMARY"
          echo "domain attach step finished"

      - name: Mark commit green — production updated
        if: env.HAS_VERCEL_SECRETS == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d '{
              "state": "success",
              "context": "deploy/vercel",
              "description": "Production deployed from this commit",
              "target_url": "https://10x-rpc.vercel.app"
            }' > /dev/null
