name: Keep Render Awake

on:
  schedule:
    # Run every 10 minutes (GitHub Actions free tier allows this)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render keep-awake
        run: |
          echo "Pinging Render at $(date -u)"
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 "https://one0x-rpc.onrender.com/api/keep-awake")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Render is awake"
          else
            echo "⚠ Render responded with $HTTP_CODE"
            exit 1
          fi

      - name: Ping Render RPC keep-alive
        run: |
          echo "Pinging RPC keep-alive at $(date -u)"
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 60 -X POST "https://one0x-rpc.onrender.com/api/rpc/keep-alive")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: $HTTP_CODE"
          echo "Response (first 500 chars): ${BODY:0:500}"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ RPC keep-alive succeeded"
          else
            echo "⚠ RPC keep-alive returned $HTTP_CODE (may be ok if no active users)"
          fi
